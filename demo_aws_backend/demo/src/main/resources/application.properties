spring.application.name=demo
server.port=8080

# --- AWS config ---
# Region your S3 bucket / DynamoDB table live in
aws.region=us-east-1
# S3 bucket used by S3Service (must already exist, or create it via the console/CLI)
aws.s3.bucket=my-demo-bucket
# DynamoDB table used by DynamoDbService (partition key: id, type String)
aws.dynamodb.table=demo_items

# File upload limits (adjust as needed)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

